spring.application.name=attendance-management-backend

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.fdaftpkgzuiktgeeabwq
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

attendance.reports.storage-path=storage/attendance-reports

# =========================================================
# SUPABASE STORAGE
# =========================================================

supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:attendance-reports}

supabase.storage.endpoint=${SUPABASE_STORAGE_ENDPOINT}

supabase.storage.region=${SUPABASE_STORAGE_REGION}

supabase.storage.access-key=${SUPABASE_STORAGE_ACCESS_KEY}

supabase.storage.secret-key=${SUPABASE_STORAGE_SECRET_KEY}

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000


# =========================================================
# FACE RECOGNITION SERVICE
# =========================================================

face.service.base-url=${FACE_SERVICE_URL:http://localhost:8001}



# =========================================================
# EMAIL PROVIDER
# =========================================================

app.email.provider=${APP_EMAIL_PROVIDER:logging}


# =========================================================
# GMAIL API
# =========================================================

app.email.gmail-api.client-id=${GOOGLE_GMAIL_CLIENT_ID:}

app.email.gmail-api.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET:}

app.email.gmail-api.refresh-token=${GOOGLE_GMAIL_REFRESH_TOKEN:}

app.email.gmail-api.sender-email=${GOOGLE_GMAIL_SENDER_EMAIL:}

app.email.gmail-api.sender-name=${GOOGLE_GMAIL_SENDER_NAME:SVNHS Attendance Management System}


# =========================================================
# OUTBOX
# =========================================================

app.email.outbox.poll-ms=${APP_EMAIL_OUTBOX_POLL_MS:5000}

app.email.outbox.batch-size=${APP_EMAIL_OUTBOX_BATCH_SIZE:10}

app.email.outbox.max-attempts=${APP_EMAIL_OUTBOX_MAX_ATTEMPTS:5}

app.email.outbox.retry-base-seconds=${APP_EMAIL_OUTBOX_RETRY_BASE_SECONDS:60}


# =========================================================
# LOGGING TEST PROVIDER
# =========================================================

app.email.logging.simulate-failure=${APP_EMAIL_LOGGING_SIMULATE_FAILURE:false}



# =========================================================
# PARENT NOTIFICATION SECURE LINK
# =========================================================

app.parent-notification.token-secret=${PARENT_NOTIFICATION_TOKEN_SECRET:}

app.parent-notification.token-valid-days=${PARENT_NOTIFICATION_TOKEN_VALID_DAYS:14}



app.parent-notification.public-url=${PARENT_NOTIFICATION_PUBLIC_URL:http://localhost:5173/attendance-notice}